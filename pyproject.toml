[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmdbg"
version = "0.0.3a44"
description = "A debugger for stepping through LLM layers and interpreting internal representations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "datasets>=4,<5",
  "gb10-load-llm==0.1.2",
  "huggingface-hub>=1.0,<3",
  "safetensors>=0.5,<1",
  "torchvision>=0.24,<1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
llmdbg = "llmdbg.cli:main"
llmdbg-dap = "llmdbg.dap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmdbg"]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens.git" }

[dependency-groups]
dev = [
    "jlens",
]
training = [
    "tensorboard>=2.14,<3",
]

name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Marketplace channel
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - release

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -e . numpy
      - name: Test Python adapter
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Install extension tooling
        working-directory: vscode-extension
        run: npm ci
      # vsce 4.0.0 predates the Marketplace's current federated-token contract.
      # This is the exact upstream fix merged in microsoft/vscode-vsce#1337;
      # remove the compatibility step after the next vsce release includes it.
      - name: Apply Marketplace OIDC compatibility fix
        working-directory: vscode-extension
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'node_modules/@vscode/vsce/out/oidc.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldUrl = "`${marketplaceUrl.replace(/\\/$/, '')}/_apis/gallery/token`";
          const newUrl = "`${marketplaceUrl.replace(/\\/$/, '')}/_apis/gallery/token?api-version=7.2-preview.1`";
          const oldAuth = 'Authorization: `Bearer ${oidcToken}`';
          const newAuth = 'Authorization: `FederatedToken ${oidcToken}`';
          if (!source.includes(oldUrl) || !source.includes(oldAuth)) {
            throw new Error('Installed vsce does not match the expected 4.0.0 OIDC implementation');
          }
          source = source.replace(oldUrl, newUrl).replace(oldAuth, newAuth);
          fs.writeFileSync(path, source);
          NODE
      - name: Validate extension JavaScript
        working-directory: vscode-extension
        run: node --check extension.js
      - name: Stage bundled adapter
        working-directory: vscode-extension
        run: npm run stage-adapter
      - name: Publish pre-release
        if: inputs.channel == 'pre-release'
        working-directory: vscode-extension
        run: npx vsce publish --oidc --pre-release --no-dependencies
      - name: Publish release
        if: inputs.channel == 'release'
        working-directory: vscode-extension
        run: npx vsce publish --oidc --no-dependencies
